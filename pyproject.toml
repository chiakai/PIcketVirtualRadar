[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picket-virtual-radar"
version = "0.1.0"
description = "Virtual radar display for Raspberry Pi and PiTFT"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5,<3",
    "qrcode>=8,<9",
]

[project.scripts]
picket-virtual-radar = "picket_virtual_radar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
